name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root lint, build, and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:youtube-iframe-types
      - run: npm run test:aurora-nova
      - run: npm run test:browser-storage
      - run: npm run test:turnstile
      - run: npm run test:shared-web
      - run: npm run test:deploy-workflow-permissions
      - run: npm run inbox:status:test
      - run: npm run typecheck:tools
      - run: npm run test:d1
      - run: npm run test:cli
      - run: npm run build

  package-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Admin worker check
            path: admin
            command: npm run check
          - name: Admin UI check
            path: admin/ui
            command: npm run check
          - name: Aurora build
            path: tools/aurora
            command: npm run build
          - name: Crystal worker check
            path: tools/crystal
            command: npm run check
          - name: Nova worker check
            path: tools/nova
            command: npm run check

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.path }}
      - run: ${{ matrix.command }}
        working-directory: ${{ matrix.path }}

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
