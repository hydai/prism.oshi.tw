version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  # npm: two entries with identical settings, split only by the Tailwind major ignore.
  # Dependabot runs each entry as a unit: the groups below yield one PR per entry that
  # spans every directory listed. Version updates only bump direct dependencies;
  # advisories in transitive packages still need Dependabot alerts (repo Settings →
  # Code security) or `npm audit` in each of these directories.
  #
  # TypeScript is pinned to one major across all six packages (6.0.x today) and eslint
  # 10 is blocked by eslint-config-next and eslint-plugin-react, so both majors are
  # ignored everywhere, together with @eslint/js (its major tracks eslint's). Lift the
  # ignores together once typescript-eslint accepts TS 7 and the lint stack supports
  # eslint 10, then bump every package in one PR.

  # The fan site and admin UI stay on Tailwind 3.4 by design (v4 rewrites the token
  # layer), so Tailwind majors are ignored here and only here.
  - package-ecosystem: npm
    directories:
      - /
      - /admin/ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    # These are apps, not libraries: raise the package.json minimum, never widen the range.
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor and patch bumps land as one PR; other majors stay separate PRs.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Vite and its plugins pin each other's majors (@vitejs/plugin-react 6 needs
      # vite 8), so a lone bump of either can never install. Move them together.
      vite-major:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
        update-types:
          - major
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major

  # The Workers and Aurora (already on Tailwind 4) take every other major as its own PR.
  - package-ecosystem: npm
    directories:
      - /admin
      - /tools/nova
      - /tools/crystal
      - /tools/aurora
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      vite-major:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/*"
        update-types:
          - major
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
